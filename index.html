<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investigador — Dashboard</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e6eaf0;--primary:#315bea;--primary2:#2448c7;--dark:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--dark);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}
.logo{font-size:20px;font-weight:800;padding:8px 12px 28px}.logo span{color:#7da0ff}
.nav a{display:block;color:#b9c1d1;text-decoration:none;padding:12px 14px;border-radius:9px;margin:4px 0}.nav a.active,.nav a:hover{background:#202b42;color:#fff}
.sidebar small{position:absolute;bottom:20px;left:28px;color:#7f8ba0}.content{margin-left:245px;width:calc(100% - 245px);padding:28px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:26px}.top p{margin:5px 0 0;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.btn:hover{background:var(--primary2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat .label{color:var(--muted);font-size:13px}.stat .number{font-size:28px;font-weight:800;margin-top:8px}
.layout{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.panel h2{font-size:17px;margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid #d5dbe5;border-radius:8px;font-size:14px}
.full{grid-column:1/-1}.sources{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.check{border:1px solid var(--line);padding:10px;border-radius:8px;font-size:13px;color:#465066}.check input{width:auto;margin-right:7px}
.recent{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--line);border-radius:10px;padding:13px}.item strong{display:block}.item span{font-size:12px;color:var(--muted)}.item-actions{margin-top:10px;display:flex;gap:7px}.mini{padding:6px 9px;border:0;border-radius:7px;cursor:pointer;background:#edf1ff;color:#2947a5;font-size:12px}.mini.del{background:#fff0f0;color:#b42318}
.empty{color:var(--muted);font-size:14px}.status{display:none;margin-top:14px;padding:10px;border-radius:8px;background:#ecfdf3;color:#087443;font-size:13px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{width:70px;padding:15px 8px}.logo{font-size:0;padding:8px}.logo span{font-size:18px}.nav a{font-size:0;text-align:center}.nav a:first-letter{font-size:18px}.sidebar small{display:none}.content{margin-left:70px;width:calc(100% - 70px);padding:20px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">INVESTIGADOR<span>.</span></div>
<nav class="nav">
<a class="active" href="#">▣ &nbsp; Dashboard</a>
<a href="#nova">＋ &nbsp; Nova investigação</a>
<a href="#recentes">◷ &nbsp; Investigações</a>
<a href="#">▤ &nbsp; Relatórios</a>
<a href="#">⚙ &nbsp; Configurações</a>
</nav>
<small>Versão 3.0 — protótipo</small>
</aside>

<section class="content">
<div class="top">
<div><h1>Dashboard</h1><p>Central de investigações patrimoniais</p></div>
<button class="btn" onclick="document.getElementById('nome').focus()">+ Nova investigação</button>
</div>

<div class="stats">
<div class="stat"><div class="label">Investigações</div><div class="number" id="total">0</div></div>
<div class="stat"><div class="label">Em andamento</div><div class="number" id="andamento">0</div></div>
<div class="stat"><div class="label">Fontes pesquisadas</div><div class="number" id="fontes">0</div></div>
<div class="stat"><div class="label">Relatórios</div><div class="number">0</div></div>
</div>

<div class="layout">
<div class="panel" id="nova">
<h2>Nova investigação</h2>
<div class="formgrid">
<div><label>Investigado</label><input id="nome" placeholder="Nome completo"></div>
<div><label>CPF / CNPJ</label><input id="documento" placeholder="Documento"></div>
<div><label>Número do processo</label><input id="processo" placeholder="0000000-00.0000.0.00.0000"></div>
<div><label>Advogado responsável</label><input id="advogado" placeholder="Nome do advogado"></div>
<div class="full"><label>Fontes / diligências</label>
<div class="sources">
<label class="check"><input type="checkbox" value="Imóveis"> Imóveis</label>
<label class="check"><input type="checkbox" value="Empresas"> Empresas</label>
<label class="check"><input type="checkbox" value="Veículos"> Veículos</label>
<label class="check"><input type="checkbox" value="Processos judiciais"> Processos judiciais</label>
<label class="check"><input type="checkbox" value="Redes sociais / OSINT"> Redes sociais / OSINT</label>
<label class="check"><input type="checkbox" value="Outras fontes"> Outras fontes</label>
</div></div>
</div>
<button class="btn" onclick="salvar()">Salvar investigação</button>
<button class="btn" style="background:#64748b;margin-left:6px" onclick="limpar()">Limpar</button>
<div class="status" id="status"></div>
</div>

<div class="panel" id="recentes">
<h2>Investigações recentes</h2>
<div class="recent" id="lista"></div>
</div>
</div>
</section>
</div>

<script>
const KEY="investigador_dashboard_v3";
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const set=d=>localStorage.setItem(KEY,JSON.stringify(d));
function msg(t){let e=document.getElementById("status");e.style.display="block";e.textContent=t;setTimeout(()=>e.style.display="none",2500)}
function limpar(){["nome","documento","processo","advogado"].forEach(x=>document.getElementById(x).value="");document.querySelectorAll(".check input").forEach(x=>x.checked=false)}
function salvar(){
let nome=document.getElementById("nome").value.trim();if(!nome){msg("Informe o nome do investigado.");return}
let d=get();let fontes=[...document.querySelectorAll(".check input:checked")].map(x=>x.value);
d.unshift({id:Date.now(),nome,documento:document.getElementById("documento").value,processo:document.getElementById("processo").value,advogado:document.getElementById("advogado").value,fontes,data:new Date().toLocaleDateString("pt-BR")});
set(d);limpar();render();msg("Investigação salva com sucesso.");
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function abrir(id){let x=get().find(a=>a.id===id);if(!x)return;document.getElementById("nome").value=x.nome;document.getElementById("documento").value=x.documento||"";document.getElementById("processo").value=x.processo||"";document.getElementById("advogado").value=x.advogado||"";document.querySelectorAll(".check input").forEach(c=>c.checked=x.fontes.includes(c.value));document.getElementById("nova").scrollIntoView({behavior:"smooth"})}
function excluir(id){let x=get().find(a=>a.id===id);if(x&&confirm("Excluir "+x.nome+"?")){set(get().filter(a=>a.id!==id));render()}}
function render(){
let d=get(),total=d.length,fontes=d.reduce((s,x)=>s+(x.fontes||[]).length,0);
document.getElementById("total").textContent=total;document.getElementById("andamento").textContent=total;document.getElementById("fontes").textContent=fontes;
let l=document.getElementById("lista");if(!d.length){l.innerHTML='<div class="empty">Nenhuma investigação cadastrada. Comece criando uma nova.</div>';return}
l.innerHTML=d.slice(0,8).map(x=>`<div class="item"><strong>${esc(x.nome)}</strong><span>${x.processo?"Processo: "+esc(x.processo):"Sem processo"} · ${esc(x.data)}</span><div class="item-actions"><button class="mini" onclick="abrir(${x.id})">Abrir</button><button class="mini del" onclick="excluir(${x.id})">Excluir</button></div></div>`).join("")
}
render();
</script>
</body>
</html>
